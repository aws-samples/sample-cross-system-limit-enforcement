spring:
  datasource:
    url: jdbc:h2:mem:limits-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration-h2
  data:
    redis:
      host: localhost
      port: 6379
  autoconfigure:
    # No Redis server in tests; skip its auto-config so the reader falls back.
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

limit-enforcement:
  default-daily-limit: 50000000.00
  currency: USD
  read-source: COMPOSED
  reconciler:
    enabled: false
